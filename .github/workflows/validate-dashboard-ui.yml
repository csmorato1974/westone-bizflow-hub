name: Validate dashboard UI feature

on:
  push:
    branches:
      - feature/dashboard-ui-offline-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ickwvreacprvsdozeabi
      VITE_SUPABASE_URL: https://ickwvreacprvsdozeabi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlja3d2cmVhY3BydnNkb3plYWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODU4MzgsImV4cCI6MjA5MjU2MTgzOH0.uUZir1afJeRGHraWo_BEMS0Li-m5QBU3wx-BXqllcts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and refresh lockfile
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
