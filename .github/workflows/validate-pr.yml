name: Validate PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required Vite env vars
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_PROJECT_ID" || (echo "Missing VITE_SUPABASE_PROJECT_ID" && exit 1)
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)

          echo "VITE_SUPABASE_PROJECT_ID present"
          echo "VITE_SUPABASE_URL present"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY present"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
