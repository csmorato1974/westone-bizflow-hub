name: Validate dashboard UI feature

on:
  push:
    branches:
      - feature/dashboard-ui-offline-base

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ickwvreacprvsdozeabi
      VITE_SUPABASE_URL: https://ickwvreacprvsdozeabi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply OFF-1 integration once
        run: |
          if [ -f scripts/apply-off1.py ]; then
            python scripts/apply-off1.py
            rm scripts/apply-off1.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/vendedor/Clientes.tsx src/pages/admin/Clientes.tsx src/pages/cliente/Catalogo.tsx scripts/apply-off1.py
            git commit -m "feat: add offline read fallback for clients and catalog"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
