name: Validate dashboard UI feature

on:
  push:
    branches:
      - feature/dashboard-ui-offline-base

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ickwvreacprvsdozeabi
      VITE_SUPABASE_URL: https://ickwvreacprvsdozeabi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlja3d2cmVhY3BydnNkb3plYWJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODU4MzgsImV4cCI6MjA5MjU2MTgzOH0.uUZir1afJeRGHraWo_BEMS0Li-m5QBU3wx-BXqllcts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and refresh lockfile
        run: npm install
      - name: Commit refreshed lockfile if needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package lock for Leaflet"
            git push
          fi
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
